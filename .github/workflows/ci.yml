name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  typecheck-and-build:
    name: Type-check and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: surewina_ci
          POSTGRES_USER: surewina_ci
          POSTGRES_PASSWORD: surewina_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surewina_ci -d surewina_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://surewina_ci:surewina_ci_password@localhost:5432/surewina_ci?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @surewina/api prisma:generate

      - name: Validate Prisma migrations
        run: pnpm --filter @surewina/api prisma:migrate:deploy

      - name: Assert deployed database matches Prisma schema
        run: pnpm --filter @surewina/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Bootstrap system chart twice (idempotency)
        run: |
          pnpm --filter @surewina/api ledger:bootstrap
          pnpm --filter @surewina/api ledger:bootstrap

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: API regression tests
        run: pnpm --filter @surewina/api exec jest --runInBand