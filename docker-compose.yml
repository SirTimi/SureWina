services:
  postgres:
    image: postgres:16-alpine
    container_name: surewina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: surewina
      POSTGRES_PASSWORD: surewina_password
      POSTGRES_DB: surewina_dev
    ports:
      - "55432:5432"
    volumes:
      - surewina_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: surewina-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - surewina_redis_data:/data

volumes:
  surewina_postgres_data:
  surewina_redis_data: